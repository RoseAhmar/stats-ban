<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Верификации</title>
<style>
  :root {
    --bg: #1a1917;
    --card: #232220;
    --card2: #2a2826;
    --border: #333230;
    --text: #e8e6e2;
    --muted: #888780;
    --accent: #d4944a;
    --green: #4caf7d;
    --red: #e05c5c;
    --blue: #5c9ce0;
    --purple: #9b7fe8;
    --yellow: #d4b44a;
    --orange: #e07a2f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

  .page-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

  .top-bar {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  .back-link {
    color: var(--muted); text-decoration: none; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    transition: color .15s, border-color .15s;
  }
  .back-link:hover { color: var(--text); border-color: var(--muted); }
  .page-title { font-size: 20px; font-weight: 700; }
  .page-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .period-bar {
    padding: 16px 0; display: flex; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .period-btn {
    padding: 6px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .period-btn:hover { color: var(--text); border-color: var(--muted); }
  .period-btn.active { background: var(--card2); color: var(--text); border-color: #555; font-weight: 600; }

  .main { padding: 20px 0; }

  /* ── Funnel ── */
  .funnel-section { margin-bottom: 28px; }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .funnel-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
  }
  .funnel-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; position: relative;
  }
  .funnel-card.highlight { border-color: var(--accent); }
  .funnel-label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .funnel-value { font-size: 32px; font-weight: 700; }
  .funnel-pct { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .funnel-value.green { color: var(--green); }
  .funnel-value.red   { color: var(--red); }
  .funnel-value.blue  { color: var(--blue); }

  /* ── Outcomes ── */
  .outcomes-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;
    margin-bottom: 28px;
  }
  .outcome-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .outcome-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .outcome-name { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .outcome-val { font-size: 24px; font-weight: 700; }
  .outcome-pct { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Tables ── */
  .table-section { margin-bottom: 28px; }
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  th {
    text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600;
    letter-spacing: .05em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  th.r, td.r { text-align: right; }
  td {
    padding: 9px 12px; border-bottom: 1px solid #282624;
  }
  tr:hover td { background: var(--card2); }
  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
  }
  .badge-green { background: rgba(76,175,125,.15); color: var(--green); }
  .badge-red   { background: rgba(224,92,92,.15);  color: var(--red); }
  .badge-blue  { background: rgba(92,156,224,.15); color: var(--blue); }
  .badge-muted { background: rgba(136,135,128,.1); color: var(--muted); }
  .badge-purple { background: rgba(155,127,232,.15); color: var(--purple); }
  .badge-yellow { background: rgba(212,180,74,.15);  color: var(--yellow); }

  .pct-bar {
    display: flex; align-items: center; gap: 8px;
  }
  .bar-outer {
    flex: 1; height: 6px; background: var(--card2); border-radius: 3px; min-width: 60px;
  }
  .bar-inner { height: 100%; border-radius: 3px; }
  .bar-green { background: var(--green); }
  .bar-red   { background: var(--red); }
  .bar-blue  { background: var(--blue); }
  .pct-num { font-size: 12px; color: var(--muted); min-width: 36px; text-align: right; }

  /* ── Weekly ── */
  .week-row-total { font-weight: 600; }

  /* ── Expandable rows ── */
  .expand-btn {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px;
    padding: 2px 6px; border-radius: 4px; transition: color .15s;
  }
  .expand-btn:hover { color: var(--text); }
  .sub-row { display: none; }
  .sub-row.open { display: table-row; }
  .sub-cell { padding: 0 12px 10px 28px !important; }
  .sub-table { width: 100%; font-size: 12px; }
  .sub-table td { padding: 5px 8px; border-bottom: 1px solid #242220; color: var(--muted); }
  .sub-table tr:last-child td { border-bottom: none; }
  .sub-table td:first-child { color: var(--text); }

  /* ── No data ── */
  .no-data { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

  .cat-active        { color: var(--green); }
  .cat-zamena        { color: var(--red); }
  .cat-ban           { color: #c44; }
  .cat-biz_verif     { color: var(--blue); }
  .cat-review        { color: var(--yellow); }
  .cat-appeal_failed { color: var(--orange); }
  .cat-other         { color: var(--muted); }

  /* ── Tooltip ── */
  #global-tip {
    display: none; position: fixed; pointer-events: none; z-index: 9999;
    background: #1e1c1a; border: 1px solid #555; border-radius: 8px;
    padding: 10px 14px; min-width: 180px; max-width: 280px;
    box-shadow: 0 8px 28px rgba(0,0,0,.7); white-space: nowrap;
  }
  .tip-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 8px; }
  .tip-row { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #2e2c2a; }
  .tip-row:last-child { border-bottom: none; }
  .tip-row .tip-key { color: var(--muted); }
  .tip-row .tip-val { font-weight: 600; color: var(--text); }
  .has-tip { cursor: default; }

  /* success pct badge */
  .success-badge {
    display: inline-block; padding: 3px 9px; border-radius: 5px; font-size: 12px; font-weight: 700;
  }
  .success-high  { background: rgba(76,175,125,.15); color: var(--green); }
  .success-mid   { background: rgba(212,180,74,.15);  color: var(--yellow); }
  .success-low   { background: rgba(224,92,92,.15);   color: var(--red); }
</style>

// ── Global floating tooltip ──
const _tip = document.getElementById('global-tip');
const _tipData = {};  // id → html string

function _placeTip(e) {
  const pad = 16;
  let x = e.clientX + pad;
  let y = e.clientY + pad;
  _tip.style.left = x + 'px';
  _tip.style.top  = y + 'px';
  // adjust after paint so offsetWidth is known
  requestAnimationFrame(() => {
    if (x + _tip.offsetWidth  > window.innerWidth  - 8) x = e.clientX - _tip.offsetWidth  - pad;
    if (y + _tip.offsetHeight > window.innerHeight - 8) y = e.clientY - _tip.offsetHeight - pad;
    _tip.style.left = x + 'px';
    _tip.style.top  = y + 'px';
  });
}
document.addEventListener('mousemove', e => {
  if (_tip.style.display === 'block') _placeTip(e);
});
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip-id]');
  if (!el) return;
  const id = el.getAttribute('data-tip-id');
  if (_tipData[id]) {
    _tip.innerHTML = _tipData[id];
    _tip.style.display = 'block';
    _placeTip(e);
  }
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest('[data-tip-id]');
  if (el && !el.contains(e.relatedTarget)) {
    _tip.style.display = 'none';
  }
});

let activePeriod = 'aug';

function setPeriod(p) {
  activePeriod = p;
  document.getElementById('btn-mar').classList.toggle('active', p === 'mar');
  document.getElementById('btn-apr').classList.toggle('active', p === 'apr');
  document.getElementById('btn-may').classList.toggle('active', p === 'may');
  document.getElementById('btn-jun').classList.toggle('active', p === 'jun');
  document.getElementById('btn-jul').classList.toggle('active', p === 'jul');
  document.getElementById('btn-aug').classList.toggle('active', p === 'aug');
  render();
}

function getData() {
  return activePeriod === 'mar' ? VERIF_MAR : activePeriod === 'apr' ? VERIF_APR : activePeriod === 'may' ? VERIF_MAY : activePeriod === 'jun' ? VERIF_JUN : activePeriod === 'jul' ? VERIF_JUL : VERIF_AUG;
}

function fmt(n) { return (n == null ? '—' : n); }
function pctFmt(n) { return (n == null ? '—' : n.toFixed(1) + '%'); }

  const m = {active:'green',zamena:'red',ban:'#c44',biz_verif:'blue',review:'yellow',appeal_failed:'orange',other:'muted'};
  return m[cat] || 'muted';

function barHtml(pct, cls) {
  return `<div class="pct-bar"><div class="bar-outer"><div class="bar-inner bar-${cls}" style="width:${Math.min(pct||0,100)}%"></div></div><span class="pct-num">${pctFmt(pct)}</span></div>`;
}

        <div class="funnel-label">Всего выдано</div>
        <div class="funnel-value">${total}</div>
        <div class="funnel-pct">Аккаунты с internal_status = Выдан</div>
      </div>
      <div class="funnel-card highlight">
        <div class="funnel-label">Прошли вериф</div>
        <div class="funnel-value blue">${vc}</div>
        <div class="funnel-pct">${pctFmt(d.verif_pct)} от выданных</div>
      </div>
      <div class="funnel-card">
        <div class="funnel-label">Не верифицированы</div>
        <div class="funnel-value">${notVerif}</div>
        <div class="funnel-pct">${pctFmt(total ? (notVerif/total*100) : 0)} от выданных</div>
      </div>
      <div class="funnel-card">
        <div class="funnel-label">Без замены/бана</div>
        <div class="funnel-value green">${vc - zamena - ban}</div>
        <div class="funnel-pct">${pctFmt(vc ? ((vc-zamena-ban)/vc*100) : 0)} от верифицированных</div>
      </div>
      <div class="funnel-card">
        <div class="funnel-label">На замену</div>
        <div class="funnel-value red">${zamena}</div>
        <div class="funnel-pct">${pctFmt(vc ? (zamena/vc*100) : 0)} от верифицированных</div>
      </div>
      <div class="funnel-card">
        <div class="funnel-label">Бан</div>
        <div class="funnel-value red">${ban}</div>
        <div class="funnel-pct">${pctFmt(vc ? (ban/vc*100) : 0)} от верифицированных</div>
      </div>
    </div>
  </div>`;

  // ── Outcomes breakdown cards ──
  const outcomeOrder = ['active','zamena','ban','biz_verif','review','appeal_failed','other'];
  html += `
  <div class="section-label">Разбивка исходов верификации</div>
  <div class="outcomes-grid">`;
  for (const cat of outcomeOrder) {
    const n = outcomes[cat] || 0;
    if (!n) continue;
    const p = vc ? (n/vc*100) : 0;
    html += `
    <div class="outcome-card">
      <div class="outcome-name">
        <span class="outcome-dot" style="background:${dotColor(cat)}"></span>${labelForCat(cat)}
      </div>
      <div class="outcome-val cat-${cat}">${n}</div>
      <div class="outcome-pct">${pctFmt(p)} от верифицированных</div>
    </div>`;
  }
  html += `</div>`;

  // ── By buyer ──
  let _tipCounter = 0;
  function withTip(inner, title, reasons) {
    if (!reasons || !Object.keys(reasons).length) return inner;
    const id = 'tip' + (++_tipCounter);
    const rows = Object.entries(reasons).sort((a,b)=>b[1]-a[1])
      .map(([k,v])=>`<div class="tip-row"><span class="tip-key">${k}</span><span class="tip-val">${v}</span></div>`).join('');
    _tipData[id] = `<div class="tip-title">${title}</div>${rows}`;
    return `<span class="has-tip" data-tip-id="${id}">${inner}</span>`;
  }
  function successBadge(pct) {
    if (pct == null) return '—';
    const cls = pct >= 60 ? 'success-high' : pct >= 35 ? 'success-mid' : 'success-low';
    return `<span class="success-badge ${cls}">${pct.toFixed(1)}%</span>`;
  }

  const byBuyer = d.by_buyer || [];
  html += `
  <div class="table-section">
    <div class="section-label">По баерам</div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Баер</th>
        <th class="r">Выдано</th>
        <th class="r">Прошли вериф</th>
        <th>% верификаций</th>
        <th class="r">Активны</th>
        <th class="r">% успеха</th>
        <th class="r">На замену</th>
        <th class="r">Бан</th>
        <th class="r">Биз.вериф</th>
        <th class="r">Review</th>
        <th class="r">Прочее</th>
      </tr></thead>
      <tbody>`;
  for (const b of byBuyer) {
    const zamCell = b.zamena ? withTip(`<span class="badge badge-red">${b.zamena}</span>`, 'Причины замены', b.zamena_reasons) : '—';
    const banCell = b.ban    ? withTip(`<span class="badge badge-red">${b.ban}</span>`,    'Причины бана',   b.ban_reasons_detail) : '—';
    html += `<tr>
      <td><strong>${b.buyer}</strong></td>
      <td class="r">${b.total}</td>
      <td class="r"><span class="badge badge-blue">${b.verif}</span></td>
      <td>${barHtml(b.verif_pct,'blue')}</td>
      <td class="r"><span class="badge badge-green">${b.active||0}</span></td>
      <td class="r">${(()=>{ const survived = b.verif - (b.zamena||0) - (b.ban||0); const pct = b.verif ? Math.round(survived/b.verif*1000)/10 : 0; return successBadge(pct); })()}</td>
      <td class="r">${zamCell}</td>
      <td class="r">${banCell}</td>
      <td class="r">${b.biz_verif||0 || '—'}</td>
      <td class="r">${b.review||0 || '—'}</td>
      <td class="r">${b.other||0 || '—'}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;

  // ── By doc_seller ──
  const byDoc = d.by_doc_seller || [];
  html += `
  <div class="table-section">
    <div class="section-label">По doc seller</div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Doc Seller</th>
        <th class="r">Выдано</th>
        <th class="r">Прошли вериф</th>
        <th>% верификаций</th>
        <th class="r">Активны</th>
        <th class="r">% успеха</th>
        <th class="r">На замену</th>
        <th class="r">Бан</th>
        <th class="r">Биз.вериф</th>
      </tr></thead>
      <tbody>`;
  for (const s of byDoc) {
    html += `<tr>
      <td><strong>${s.seller}</strong></td>
      <td class="r">${s.total}</td>
      <td class="r"><span class="badge badge-blue">${s.verif}</span></td>
      <td>${barHtml(s.verif_pct,'blue')}</td>
      <td class="r"><span class="badge badge-green">${s.active||0}</span></td>
      <td>${barHtml(s.active_pct,'green')}</td>
      <td class="r">${s.zamena||0 ? `<span class="badge badge-red">${s.zamena}</span>` : '—'}</td>
      <td class="r">${s.ban||0 ? `<span class="badge badge-red">${s.ban}</span>` : '—'}</td>
      <td class="r">${s.biz_verif||0 || '—'}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;

  // ── By gmail_seller ──
  const byGmail = d.by_gmail_seller || [];
  html += `
  <div class="table-section">
    <div class="section-label">По gmail seller</div>
    <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Gmail Seller</th>
        <th class="r">Выдано</th>
        <th class="r">Прошли вериф</th>
        <th>% верификаций</th>
        <th class="r">Активны</th>
        <th class="r">% успеха</th>
        <th class="r">На замену</th>
        <th class="r">Бан</th>
      </tr></thead>
      <tbody>`;
  for (const s of byGmail) {
    html += `<tr>
      <td><strong>${s.seller}</strong></td>
      <td class="r">${s.total}</td>
      <td class="r"><span class="badge badge-blue">${s.verif}</span></td>
      <td>${barHtml(s.verif_pct,'blue')}</td>
      <td class="r"><span class="badge badge-green">${s.active||0}</span></td>
      <td>${barHtml(s.active_pct,'green')}</td>
      <td class="r">${s.zamena||0 ? `<span class="badge badge-red">${s.zamena}</span>` : '—'}</td>
      <td class="r">${s.ban||0 ? `<span class="badge badge-red">${s.ban}</span>` : '—'}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;

  // ── Weekly dynamics ──
  const weekly = d.weekly || [];
  if (weekly.length) {
    html += `
    <div class="table-section">
      <div class="section-label">Недельная динамика</div>
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Неделя (с)</th>
          <th class="r">Выдано</th>
          <th class="r">Прошли вериф</th>
          <th>% верификаций</th>
          <th class="r">Активны</th>
          <th class="r">% успеха</th>
          <th class="r">На замену</th>
          <th class="r">Бан</th>
          <th class="r">Биз.вериф</th>
        </tr></thead>
        <tbody>`;
    for (const w of weekly) {
      html += `<tr class="week-row-total">
        <td>${w.week}</td>
        <td class="r">${w.total}</td>
        <td class="r"><span class="badge badge-blue">${w.verif||0}</span></td>
        <td>${barHtml(w.verif_pct,'blue')}</td>
        <td class="r"><span class="badge badge-green">${w.active||0}</span></td>
        <td>${barHtml(w.active_pct,'green')}</td>
        <td class="r">${w.zamena||0 ? `<span class="badge badge-red">${w.zamena}</span>` : '—'}</td>
        <td class="r">${w.ban||0 ? `<span class="badge badge-red">${w.ban}</span>` : '—'}</td>
        <td class="r">${w.biz_verif||0 || '—'}</td>
      </tr>`;
    }
    html += `</tbody></table></div></div>`;
  }

  // ── Detailed status breakdown ──
  const banReasons = d.ban_reasons || [];
  if (banReasons.length) {
    html += `
    <div class="table-section">
      <div class="section-label">Детальная разбивка статусов (прошедшие вериф)</div>
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Account Status</th>
          <th>Категория</th>
          <th class="r">Кол-во</th>
          <th>Доля от прошедших вериф</th>
        </tr></thead>
        <tbody>`;
    for (const r of banReasons) {
      html += `<tr>
        <td>${r.status}</td>
        <td><span class="badge ${badgeClass(r.cat)}">${labelForCat(r.cat)}</span></td>
        <td class="r">${r.count}</td>
        <td>${barHtml(r.pct, colorForCat(r.cat))}</td>
      </tr>`;
    }
    html += `</tbody></table></div></div>`;
  }

  el.innerHTML = html;
}

// Initial render
render();
</script>
</body>
</html>
